<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Test Google Login</title></head>
<body>
  <h1>Test Login Google → Chistix API</h1>
  <div id="buttonDiv"></div>
  <pre id="output">Menunggu login...</pre>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    window.onload = function () {
      google.accounts.id.initialize({
        client_id: "766972880320-sa47qh0s3a7codkhvejtaagiq3rt55rt.apps.googleusercontent.com",
        callback: async (response) => {
          const res = await fetch("http://localhost:5000/api/auth/google", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credential: response.credential }),
          });
          document.getElementById("output").textContent =
            JSON.stringify(await res.json(), null, 2);
        },
      });
      google.accounts.id.renderButton(document.getElementById("buttonDiv"), { theme: "outline", size: "large" });
    };
  </script>
</body>
</html>
